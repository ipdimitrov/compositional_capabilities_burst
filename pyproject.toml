[project]
name = "compositional-capabilities"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "numba==0.57.0",
    "omegaconf==2.3.0",
    "numpy==1.24.4",
    "fpdf2==2.8.3",
    "tqdm==4.67.3",
    "matplotlib==3.10.8",
    "ipykernel==7.2.0",
    "ipython==8.14.0",
    "jupyter==1.0.0",
    "plotly>=6.5.2",
    "kaleido>=1.2.0",
]

[tool.uv]
index = [
    { name = "pytorch-cu126", url = "https://download.pytorch.org/whl/cu126", explicit = true },
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
