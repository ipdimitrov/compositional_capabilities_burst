[project]
name = "compositional-capabilities"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.12.0.dev20260325+cu128",
    "torchvision==0.26.0.dev20260325+cu128",
    "torchaudio==2.11.0.dev20260325+cu128",
    "omegaconf==2.3.0",
    "numpy==1.26.4",
    "tqdm==4.67.3",
    "matplotlib==3.10.8",
    "ipykernel==7.2.0",
    "ipython==9.12.0",
    "jupyter==1.1.1",
    "ipywidgets==8.1.8",
    "scikit-learn==1.7.2",
    "einops>=0.8.2",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
index = [
    { name = "pytorch-nightly-cu128", url = "https://download.pytorch.org/whl/nightly/cu128", explicit = true },
    { name = "pytorch-nightly", url = "https://download.pytorch.org/whl/nightly", explicit = true },
]
override-dependencies = [
    "triton; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-nightly-cu128" }
torchvision = { index = "pytorch-nightly-cu128" }
torchaudio = { index = "pytorch-nightly-cu128" }
triton = { index = "pytorch-nightly" }

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "D",
    "T201",
    "COM812",
    "ISC001",
    "S101",
    "FBT",
    "INP001",
    "PLR0913",
    "PLR0915",
    "PLR0912",
    "C901",
    "ERA001",
    "N806",
    "N803",
    "N802",
    "N801",
    "N812",
    "PLR2004",
    "B905",
    "EM101",
    "EM102",
    "TRY003",
    "S301",
    "S603",
    "S607",
    "BLE001",
    "RUF001",
    "RUF002",
    "RUF003",
    "ARG001",
    "PLW2901",
    "B007",
    "SIM108",
    "TC003",
    "TRY300",
    "S110",
    "PLC0415",
    "PTH",
    "NPY002",
    "NPY201",
    "RET504",
    "EXE002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR"]
"burst/dev/*" = ["ALL"]
"_fix*.py" = ["ALL"]
"notebooks/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
