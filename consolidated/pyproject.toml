[project]
name = "burst-forgetting"
version = "1.0.0"
description = "Compositional capabilities burst forgetting experiments"
requires-python = "==3.10.*"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "omegaconf==2.3.0",
    "numpy==1.24.4",
    "tqdm==4.67.3",
    "matplotlib==3.10.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["burst"]

[project.scripts]
burst-run = "run_experiment:main"

[tool.uv]
environments = ["sys_platform == 'linux'"]
index = [
    { name = "pytorch-nightly-cu128", url = "https://download.pytorch.org/whl/nightly/cu128", explicit = true },
    { name = "pytorch-nightly", url = "https://download.pytorch.org/whl/nightly", explicit = true },
]
override-dependencies = [
    "triton; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-nightly-cu128" }
torchvision = { index = "pytorch-nightly-cu128" }
torchaudio = { index = "pytorch-nightly-cu128" }
triton = { index = "pytorch-nightly" }
